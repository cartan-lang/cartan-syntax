[package]
name = "cartan-syntax"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cartan concrete syntax parsing and shared grammar tooling"

[workspace]
members = ["cli", "support/treegram", "support/diagnostics", "support/syntax-diagnostics"]
default-members = ["cli"]
resolver = "2"

[dependencies]
treegram = { path = "support/treegram" }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
# Serialize the source AST; off by default so the library needs no registry
# dependency. The CLI enables it for its JSON and tree views.
serde = ["dep:serde"]
