[package]
name = "cartan-syntax"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cartan concrete syntax parsing and shared grammar tooling"

[workspace]
members = ["cli", "support/treegram"]
default-members = ["cli"]
resolver = "2"

[dependencies]
treegram = { path = "support/treegram" }
