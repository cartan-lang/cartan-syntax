[package]
name = "cartan-syntax-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Command-line inspection of Cartan source syntax"

[[bin]]
name = "cartan-syntax"
path = "src/main.rs"
doc = false

[dependencies]
cartan-syntax = { path = ".." }
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "color"] }
serde_json = "1.0"
