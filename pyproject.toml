[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartan-syntax-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13", "starlette>=0.40", "uvicorn>=0.30", "markdown-it-py>=3"]

[project.scripts]
cartdev-syntax = "syntax_dev.application:main"

[project.entry-points."cartan.dev.components"]
syntax = "syntax_dev.application:component"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/syntax_dev"]

[tool.cartdev]
