[package]
name = "cartan-cli-support"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shared help, discovery, color and JSON result conventions for Cartan component CLIs"

[dependencies]
cartan-diagnostics = { path = "../diagnostics" }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "color"] }
serde_json = "1.0"
